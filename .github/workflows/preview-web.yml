name: Preview Web

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview-web:
    # Fork PR には本番用の Cloudflare Secret を渡さない。
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Preview Web Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: web-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WEB_AUTH_CLIENT_SECRET: ${{ secrets.WEB_AUTH_CLIENT_SECRET }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Require deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$WEB_AUTH_CLIENT_SECRET"
      - name: Build Web assets
        run: npm run build:web
      - name: Upload Web Preview version
        id: upload
        working-directory: apps/web
        run: |
          set -o pipefail
          secrets_file="$(mktemp)"
          output_file="$(mktemp)"
          trap 'rm -f "$secrets_file" "$output_file"' EXIT
          chmod 600 "$secrets_file"
          node -e 'const { writeFileSync } = require("node:fs"); writeFileSync(process.argv[1], JSON.stringify({ AUTH_CLIENT_SECRET: process.env.WEB_AUTH_CLIENT_SECRET }));' "$secrets_file"
          npx wrangler versions upload \
            --preview-alias "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER} Web Preview" \
            --secrets-file "$secrets_file" 2>&1 | tee "$output_file"
          preview_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$output_file" | tail -1 || true)"
          if [ -z "$preview_url" ]; then
            echo "Wrangler did not return a Preview URL" >&2
            exit 1
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
      - name: Comment Preview URL on pull request
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.preview_url }}
        with:
          script: |
            const marker = "<!-- web-preview-url -->";
            const body = `${marker}\n✅ Web Preview: [開く](${process.env.PREVIEW_URL})\n\nコミット: \`${context.payload.pull_request.head.sha.slice(0, 7)}\``;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number },
            );
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
