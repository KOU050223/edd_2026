name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Compile
        run: npm run compile
      - name: Check generated concepts
        run: npm run check:concepts
      - name: Check generated Worker types
        run: npm run check:worker-types
      - name: Build Web assets
        run: npm run build:web
      - name: Check project rules
        run: npm run test:project-rules
      - name: Run tests
        run: npm run test
